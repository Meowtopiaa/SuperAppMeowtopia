components:
  securitySchemes:
    sanctumBearer:
      type: http
      scheme: bearer
      description: Token Laravel Sanctum
  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema:
        type: string
      description: Gunakan key yang sama saat mengulang permintaan yang sama.
  schemas:
    Error:
      type: object
      properties:
        success:
          type: boolean
          enum:
          - false
        code:
          type: string
        message:
          type: string
        errors:
          type: object
          additionalProperties: true
        request_id:
          type: string
      required:
      - success
      - code
      - message
      - request_id
  responses:
    Error401:
      description: Token login diperlukan atau tidak valid.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Error403:
      description: Akses ditolak, misalnya NOT_STUDENT, email belum terverifikasi, bukan pemilik, atau permission
        kurang.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Error404:
      description: Resource tidak ditemukan.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Error409:
      description: Konflik status, kuota, atau permintaan berulang.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Error422:
      description: Input atau prasyarat bisnis tidak valid.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
