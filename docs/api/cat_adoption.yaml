openapi: 3.0.3
info:
  title: Meowtopia Adoption API
  version: 0.2.0-draft
  description: Draft EN-7 berdasarkan PRD v1.1 §8.6 dan §6.5, diselaraskan dengan implementasi Sprint 1 (EN-11,
    EN-13, EN-14, EN-15, EN-17) di branch team/enigma. Endpoint yang belum diimplementasikan masih rancangan.
    Nama field, nilai enum keputusan, pemetaan permission admin, dan bentuk data yang tidak dirinci PRD adalah
    usulan untuk review.
servers:
- url: /api/v1
security:
- sanctumBearer: []
paths:
  /adoption/cats:
    get:
      operationId: listReadyCats
      summary: Lihat katalog kucing READY tanpa adopsi aktif.
      description: Mahasiswa dengan email terverifikasi (EN-12, ADP-05, CAT-09). Hanya kucing adoption_status
        READY, presence_status ON_CAMPUS, tanpa adopsi terbuka, dan tanpa lock pengambilan HELD. Respons hanya
        memuat field publik di bawah; koordinat, unique_code, token QR, traits, territory, dan waktu perjumpaan
        tidak pernah dikirim.
      tags:
      - Adopsi
      parameters:
      - name: per_page
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
          maximum: 50
          default: 20
      - name: page
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
          default: 1
      responses:
        '200':
          description: Permintaan berhasil diproses.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    enum:
                    - true
                  message:
                    type: string
                  data:
                    type: array
                    items:
                      type: object
                      additionalProperties: false
                      properties:
                        id:
                          type: string
                          pattern: ^[0-7][0-9A-HJKMNP-TV-Z]{25}$
                        name:
                          type: string
                        gender:
                          type: string
                          nullable: true
                          enum:
                          - MALE
                          - FEMALE
                          - UNKNOWN
                          - null
                        color_pattern:
                          type: string
                          nullable: true
                        age_group:
                          type: string
                          nullable: true
                          enum:
                          - KITTEN
                          - ADULT
                          - SENIOR
                          - UNKNOWN
                          - null
                        is_sterilized:
                          type: boolean
                          nullable: true
                        description:
                          type: string
                          nullable: true
                        primary_photo_media_id:
                          type: string
                          nullable: true
                          description: ULID media. URL foto diambil lewat GET /media/{id}/url.
                        adoption_status:
                          type: string
                          enum:
                          - READY
                      required:
                      - id
                      - name
                      - adoption_status
                  meta:
                    type: object
                    properties:
                      current_page:
                        type: integer
                      per_page:
                        type: integer
                      total:
                        type: integer
                      last_page:
                        type: integer
                      has_more:
                        type: boolean
                required:
                - success
                - message
                - data
        '401':
          $ref: '#/components/responses/Error401'
        '403':
          $ref: '#/components/responses/Error403'
        '422':
          $ref: '#/components/responses/Error422'
  /adoption/applications:
    post:
      operationId: createApplicationDraft
      summary: Buat draf kelayakan tanpa memilih kucing.
      description: Mahasiswa dengan email terverifikasi. Buat draf kelayakan tanpa memilih kucing. Ditolak 409
        CONFLICT bila masih ada pengajuan berjalan atau kelayakan APPROVED yang masih berlaku.
      tags:
      - Adopsi
      responses:
        '201':
          description: Permintaan berhasil diproses.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    enum:
                    - true
                  message:
                    type: string
                  data:
                    $ref: '#/components/schemas/ApplicationDetail'
                  meta:
                    type: object
                    additionalProperties: true
                required:
                - success
                - message
                - data
        '401':
          $ref: '#/components/responses/Error401'
        '403':
          $ref: '#/components/responses/Error403'
        '409':
          $ref: '#/components/responses/Error409'
        '422':
          $ref: '#/components/responses/Error422'
      parameters:
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ApplicationDraftInput'
  /adoption/applications/{id}:
    put:
      operationId: saveApplicationDraft
      summary: Simpan draf kelayakan milik pengguna.
      description: Mahasiswa dengan email terverifikasi. Hanya pemilik pengajuan. Simpan draf kelayakan milik
        pengguna. Hanya status DRAFT atau REVISION_REQUESTED yang dapat diubah; selain itu 409 CONFLICT.
      tags:
      - Adopsi
      responses:
        '200':
          description: Permintaan berhasil diproses.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    enum:
                    - true
                  message:
                    type: string
                  data:
                    $ref: '#/components/schemas/ApplicationDetail'
                  meta:
                    type: object
                    additionalProperties: true
                required:
                - success
                - message
                - data
        '401':
          $ref: '#/components/responses/Error401'
        '403':
          $ref: '#/components/responses/Error403'
        '404':
          $ref: '#/components/responses/Error404'
        '409':
          $ref: '#/components/responses/Error409'
        '422':
          $ref: '#/components/responses/Error422'
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          pattern: ^[0-7][0-9A-HJKMNP-TV-Z]{25}$
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ApplicationDraftInput'
  /adoption/applications/{id}/submit:
    post:
      operationId: submitApplication
      summary: Ajukan kelayakan dan jalankan precheck
      description: 'Mahasiswa dengan email terverifikasi. Hanya pemilik pengajuan. Draf wajib berisi housing_type,
        owner_permission, can_afford, long_term_plan, foto tempat tinggal, dan persetujuan komitmen versi berlaku;
        bila kurang, 422 VALIDATION_ERROR dengan errors per field. Precheck: izin tempat tinggal, adopsi berjalan,
        masa tunggu. Hasil precheck terpisah dari keputusan admin.'
      tags:
      - Adopsi
      responses:
        '200':
          description: Permintaan berhasil diproses.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    enum:
                    - true
                  message:
                    type: string
                  data:
                    $ref: '#/components/schemas/ApplicationDetail'
                  meta:
                    type: object
                    properties:
                      precheck_failures:
                        type: array
                        items:
                          type: string
                          enum:
                          - NO_OWNER_PERMISSION
                          - ALREADY_ADOPTING
                          - COOLDOWN_ACTIVE
                        description: Alasan precheck yang gagal (ADP-03). Pengajuan tetap SUBMITTED dengan precheck_passed=false;
                          keputusan tetap di admin. NO_OWNER_PERMISSION adalah alasan precheck, bukan kode error.
                required:
                - success
                - message
                - data
        '401':
          $ref: '#/components/responses/Error401'
        '403':
          $ref: '#/components/responses/Error403'
        '404':
          $ref: '#/components/responses/Error404'
        '409':
          $ref: '#/components/responses/Error409'
        '422':
          $ref: '#/components/responses/Error422'
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          pattern: ^[0-7][0-9A-HJKMNP-TV-Z]{25}$
      - $ref: '#/components/parameters/IdempotencyKey'
  /adoption/applications/mine:
    get:
      operationId: getMyApplications
      summary: Lihat status pengajuan kelayakan dan catatan admin
      description: Mahasiswa dengan email terverifikasi. Daftar pengajuan milik sendiri, terbaru lebih dulu, beserta
        catatan admin.
      tags:
      - Adopsi
      responses:
        '200':
          description: Permintaan berhasil diproses.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    enum:
                    - true
                  message:
                    type: string
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/ApplicationDetail'
                  meta:
                    type: object
                    additionalProperties: true
                required:
                - success
                - message
                - data
        '401':
          $ref: '#/components/responses/Error401'
        '403':
          $ref: '#/components/responses/Error403'
  /adoption/pickups/start:
    post:
      operationId: startPickup
      summary: Mulai pengambilan lewat QR kalung
      description: 'Mahasiswa dengan email terverifikasi dan kelayakan APPROVED yang masih berlaku (30 hari, OQ-09).
        Server memeriksa QR kucing, kelayakan, adopsi berjalan, masa tunggu, status READY, presence ON_CAMPUS,
        dan lock lain. Penahanan disimpan di adoption_pickup_locks (HELD, default 48 jam); adoption_status kucing
        tetap READY sampai confirm (PRD §5.1, §5.3). Redaksi "mengatur adoption_status" di §8.6 diajukan untuk
        direvisi PM utama. Bila pengguna sudah menahan kucing yang sama, lock yang ada dikembalikan. Kode error:
        403 FORBIDDEN (kelayakan tidak berlaku); 409 ALREADY_ADOPTING, COOLDOWN_ACTIVE, CAT_NOT_AVAILABLE, CONFLICT
        (menahan kucing lain); 422 VALIDATION_ERROR, QR_INVALID, QR_REVOKED, QR_WRONG_TYPE.'
      tags:
      - Adopsi
      responses:
        '200':
          description: Permintaan berhasil diproses.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    enum:
                    - true
                  message:
                    type: string
                  data:
                    type: object
                    properties:
                      pickup_lock_id:
                        type: string
                        pattern: ^[0-7][0-9A-HJKMNP-TV-Z]{25}$
                      cat_id:
                        type: string
                        pattern: ^[0-7][0-9A-HJKMNP-TV-Z]{25}$
                      expires_at:
                        type: string
                        format: date-time
                    required:
                    - pickup_lock_id
                    - cat_id
                    - expires_at
                  meta:
                    type: object
                    additionalProperties: true
                required:
                - success
                - message
                - data
        '401':
          $ref: '#/components/responses/Error401'
        '403':
          $ref: '#/components/responses/Error403'
        '409':
          $ref: '#/components/responses/Error409'
        '422':
          $ref: '#/components/responses/Error422'
      parameters:
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                cat_code:
                  type: string
              required:
              - cat_code
  /adoption/pickups/confirm:
    post:
      operationId: confirmPickup
      summary: Konfirmasi pickup secara atomik
      description: Mahasiswa dengan email terverifikasi. Pemilik lock dengan kelayakan APPROVED yang masih berlaku.
        Konfirmasi pickup secara atomik. Foto kucing berkalung berasal dari kamera aplikasi. Server memeriksa
        ulang syarat dan menjamin satu adopsi aktif per kucing dan per adopter. pickup_lock_id dan lokasi opsional
        adalah usulan kontrak.
      tags:
      - Adopsi
      responses:
        '200':
          description: Permintaan berhasil diproses.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    enum:
                    - true
                  message:
                    type: string
                  data:
                    type: object
                    properties:
                      id:
                        type: string
                        pattern: ^[0-7][0-9A-HJKMNP-TV-Z]{25}$
                      cat_id:
                        type: string
                        pattern: ^[0-7][0-9A-HJKMNP-TV-Z]{25}$
                      status:
                        type: string
                      followup_schedule:
                        type: array
                        items:
                          type: object
                          additionalProperties: true
                    required:
                    - id
                    - cat_id
                    - status
                  meta:
                    type: object
                    additionalProperties: true
                required:
                - success
                - message
                - data
        '401':
          $ref: '#/components/responses/Error401'
        '403':
          $ref: '#/components/responses/Error403'
        '409':
          $ref: '#/components/responses/Error409'
        '422':
          $ref: '#/components/responses/Error422'
      parameters:
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                pickup_lock_id:
                  type: string
                  pattern: ^[0-7][0-9A-HJKMNP-TV-Z]{25}$
                pickup_media_id:
                  type: string
                  pattern: ^[0-7][0-9A-HJKMNP-TV-Z]{25}$
                location:
                  type: object
                  description: Konvensi koordinat PRD §8.1.
                  properties:
                    lat:
                      type: number
                      minimum: -90
                      maximum: 90
                    lng:
                      type: number
                      minimum: -180
                      maximum: 180
                    accuracy_m:
                      type: number
                      minimum: 0
                  required:
                  - lat
                  - lng
                responsibility_confirmed:
                  type: boolean
                  enum:
                  - true
              required:
              - pickup_lock_id
              - pickup_media_id
              - responsibility_confirmed
  /adoption/mine:
    get:
      operationId: getMyAdoption
      summary: Lihat Kucing Saya dan jadwal follow-up
      description: Mahasiswa dengan email terverifikasi. Lihat Kucing Saya dan jadwal follow-up. Hanya adopsi
        ACTIVE. Daftar kosong berarti tidak ada adopsi aktif, sebagai usulan respons.
      tags:
      - Adopsi
      responses:
        '200':
          description: Permintaan berhasil diproses.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    enum:
                    - true
                  message:
                    type: string
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: string
                          pattern: ^[0-7][0-9A-HJKMNP-TV-Z]{25}$
                        cat_id:
                          type: string
                          pattern: ^[0-7][0-9A-HJKMNP-TV-Z]{25}$
                        status:
                          type: string
                        followup_schedule:
                          type: array
                          items:
                            type: object
                            additionalProperties: true
                      required:
                      - id
                      - cat_id
                      - status
                  meta:
                    type: object
                    additionalProperties: true
                required:
                - success
                - message
                - data
        '401':
          $ref: '#/components/responses/Error401'
        '403':
          $ref: '#/components/responses/Error403'
  /adoption/{id}/followups:
    post:
      operationId: submitFollowup
      summary: Kirim follow-up dengan foto dari kamera aplikasi
      description: Mahasiswa dengan email terverifikasi. Hanya adopter pemilik adopsi. Kirim follow-up dengan
        foto dari kamera aplikasi. Jadwal tiap 14 hari selama tiga bulan kalender pertama. Pengiriman terlambat
        diterima dan periode tidak diduplikasi. Cara memilih periode terlambat perlu disepakati.
      tags:
      - Adopsi
      responses:
        '201':
          description: Permintaan berhasil diproses.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    enum:
                    - true
                  message:
                    type: string
                  data:
                    type: object
                    additionalProperties: true
                  meta:
                    type: object
                    additionalProperties: true
                required:
                - success
                - message
                - data
        '401':
          $ref: '#/components/responses/Error401'
        '403':
          $ref: '#/components/responses/Error403'
        '404':
          $ref: '#/components/responses/Error404'
        '409':
          $ref: '#/components/responses/Error409'
        '422':
          $ref: '#/components/responses/Error422'
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          pattern: ^[0-7][0-9A-HJKMNP-TV-Z]{25}$
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                media_id:
                  type: string
                  pattern: ^[0-7][0-9A-HJKMNP-TV-Z]{25}$
                condition:
                  type: string
                notes:
                  type: string
              required:
              - media_id
              - condition
  /adoption/{id}/returns:
    post:
      operationId: requestReturn
      summary: Ajukan pengembalian
      description: Mahasiswa dengan email terverifikasi. Hanya adopter pemilik adopsi. Ajukan pengembalian. Default
        adoption.return_enabled=false. Pengembalian biasa setelah tiga bulan kalender, lebih awal lewat jalur
        darurat. Bukti diunggah setelah persetujuan, tetapi §8.6 belum memberi operasi khusus untuk mengaitkan
        bukti dengan pengembalian. Mekanisme tersebut perlu disepakati.
      tags:
      - Adopsi
      responses:
        '201':
          description: Permintaan berhasil diproses.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    enum:
                    - true
                  message:
                    type: string
                  data:
                    type: object
                    additionalProperties: true
                  meta:
                    type: object
                    additionalProperties: true
                required:
                - success
                - message
                - data
        '401':
          $ref: '#/components/responses/Error401'
        '403':
          $ref: '#/components/responses/Error403'
        '404':
          $ref: '#/components/responses/Error404'
        '409':
          $ref: '#/components/responses/Error409'
        '422':
          $ref: '#/components/responses/Error422'
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          pattern: ^[0-7][0-9A-HJKMNP-TV-Z]{25}$
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                reason:
                  type: string
                type:
                  type: string
                  enum:
                  - REGULAR
                  - EMERGENCY
                  description: Sesuai kolom adoption_returns.type (PRD §7.4).
              required:
              - reason
  /adoption/{id}/issues:
    post:
      operationId: reportIssue
      summary: Laporkan kendala adopsi
      description: Mahasiswa dengan email terverifikasi. Hanya adopter pemilik adopsi. Laporkan kendala adopsi.
        Foto opsional dan laporan tidak otomatis menutup adopsi.
      tags:
      - Adopsi
      responses:
        '201':
          description: Permintaan berhasil diproses.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    enum:
                    - true
                  message:
                    type: string
                  data:
                    type: object
                    additionalProperties: true
                  meta:
                    type: object
                    additionalProperties: true
                required:
                - success
                - message
                - data
        '401':
          $ref: '#/components/responses/Error401'
        '403':
          $ref: '#/components/responses/Error403'
        '404':
          $ref: '#/components/responses/Error404'
        '409':
          $ref: '#/components/responses/Error409'
        '422':
          $ref: '#/components/responses/Error422'
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          pattern: ^[0-7][0-9A-HJKMNP-TV-Z]{25}$
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                category:
                  type: string
                description:
                  type: string
                media_id:
                  type: string
                  pattern: ^[0-7][0-9A-HJKMNP-TV-Z]{25}$
              required:
              - category
              - description
  /admin/adoption/applications:
    get:
      operationId: listAdoptionApplications
      summary: Lihat antrean pengajuan kelayakan.
      description: Admin dengan permission adoption.review. Pemetaan izin per operasi di bawah adalah usulan.
        Lihat antrean pengajuan kelayakan.
      tags:
      - Admin Adopsi
      responses:
        '200':
          description: Permintaan berhasil diproses.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    enum:
                    - true
                  message:
                    type: string
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: string
                          pattern: ^[0-7][0-9A-HJKMNP-TV-Z]{25}$
                        status:
                          type: string
                        precheck_passed:
                          type: boolean
                          nullable: true
                        admin_note:
                          type: string
                          nullable: true
                      required:
                      - id
                      - status
                  meta:
                    type: object
                    additionalProperties: true
                required:
                - success
                - message
                - data
        '401':
          $ref: '#/components/responses/Error401'
        '403':
          $ref: '#/components/responses/Error403'
  /admin/adoption/applications/{id}/decision:
    post:
      operationId: decideAdoptionApplication
      summary: Catat keputusan dan alasan, aktor serta waktu
      description: Admin dengan permission adoption.review atau adoption.approve sesuai keputusan. Pemetaan izin
        per operasi di bawah adalah usulan. Catat keputusan dan alasan, aktor serta waktu. Persetujuan tidak membuat
        adopsi aktif.
      tags:
      - Admin Adopsi
      responses:
        '200':
          description: Permintaan berhasil diproses.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    enum:
                    - true
                  message:
                    type: string
                  data:
                    type: object
                    properties:
                      id:
                        type: string
                        pattern: ^[0-7][0-9A-HJKMNP-TV-Z]{25}$
                      status:
                        type: string
                      precheck_passed:
                        type: boolean
                        nullable: true
                      admin_note:
                        type: string
                        nullable: true
                    required:
                    - id
                    - status
                  meta:
                    type: object
                    additionalProperties: true
                required:
                - success
                - message
                - data
        '401':
          $ref: '#/components/responses/Error401'
        '403':
          $ref: '#/components/responses/Error403'
        '404':
          $ref: '#/components/responses/Error404'
        '409':
          $ref: '#/components/responses/Error409'
        '422':
          $ref: '#/components/responses/Error422'
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          pattern: ^[0-7][0-9A-HJKMNP-TV-Z]{25}$
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                decision:
                  type: string
                  enum:
                  - APPROVE
                  - REQUEST_CHANGES
                  - REJECT
                reason:
                  type: string
              required:
              - decision
              - reason
  /admin/adoption/cats/{cat_id}/set-ready:
    post:
      operationId: setCatReadyForAdoption
      summary: Tetapkan status READY lewat CatStatusService dengan alasan dan riwayat.
      description: 'Admin dengan permission adoption.set_ready. Tetapkan READY lewat CatStatusService dengan alasan;
        riwayat di cat_status_logs. Hanya kucing presence ON_CAMPUS dengan adoption_status UNREVIEWED atau RETURNED_REVIEW.
        Kode error: 403 FORBIDDEN, 404 NOT_FOUND, 409 CAT_NOT_AVAILABLE atau CONFLICT, 422 VALIDATION_ERROR. Pencabutan
        READY belum tersedia (menunggu keputusan PM utama).'
      tags:
      - Admin Adopsi
      responses:
        '200':
          description: Permintaan berhasil diproses.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    enum:
                    - true
                  message:
                    type: string
                  data:
                    type: object
                    properties:
                      id:
                        type: string
                        pattern: ^[0-7][0-9A-HJKMNP-TV-Z]{25}$
                      name:
                        type: string
                      adoption_status:
                        type: string
                        enum:
                        - READY
                    required:
                    - id
                    - adoption_status
                  meta:
                    type: object
                    additionalProperties: true
                required:
                - success
                - message
                - data
        '401':
          $ref: '#/components/responses/Error401'
        '403':
          $ref: '#/components/responses/Error403'
        '404':
          $ref: '#/components/responses/Error404'
        '409':
          $ref: '#/components/responses/Error409'
        '422':
          $ref: '#/components/responses/Error422'
      parameters:
      - name: cat_id
        in: path
        required: true
        schema:
          type: string
          pattern: ^[0-7][0-9A-HJKMNP-TV-Z]{25}$
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                reason:
                  type: string
              required:
              - reason
