components:
  securitySchemes:
    sanctumBearer:
      type: http
      scheme: bearer
      description: Token Laravel Sanctum
  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema:
        type: string
      description: Gunakan key yang sama saat mengulang permintaan yang sama.
  schemas:
    Error:
      type: object
      properties:
        success:
          type: boolean
          enum:
          - false
        code:
          type: string
        message:
          type: string
        errors:
          type: object
          additionalProperties: true
        request_id:
          type: string
      required:
      - success
      - code
      - message
      - request_id
    ApplicationStatus:
      type: string
      enum:
      - DRAFT
      - SUBMITTED
      - REVISION_REQUESTED
      - APPROVED
      - REJECTED
      description: Status kelayakan adopter (PRD §5.2).
    ApplicationDraftInput:
      type: object
      description: Semua field boleh kosong saat draf (ADP-02). cat_id dilarang; kucing dipilih saat pengambilan
        (FIX-06). Field yang dikirim null pada PUT dikosongkan.
      properties:
        housing_type:
          type: string
          maxLength: 50
          nullable: true
        owner_permission:
          type: boolean
          nullable: true
          description: Izin pemilik/pengelola tempat tinggal.
        can_afford:
          type: boolean
          nullable: true
        long_term_plan:
          type: string
          maxLength: 2000
          nullable: true
        answers:
          type: object
          additionalProperties: true
          nullable: true
          description: Jawaban tambahan opsional.
        housing_media_id:
          type: string
          pattern: ^[0-7][0-9A-HJKMNP-TV-Z]{25}$
          nullable: true
          description: Foto tempat tinggal, diunggah lebih dulu lewat POST /media milik pengguna sendiri. Purpose
            sementara adoption_evidence sampai Core menyediakan purpose khusus.
        commitment_accepted:
          type: boolean
          nullable: true
        commitment_version:
          type: string
          nullable: true
          description: Wajib bila commitment_accepted true. Versi berlaku 1.0 (konstanta sementara).
    ApplicationDetail:
      type: object
      description: Data privat; hanya untuk pemilik pengajuan dan adoption_admin.
      properties:
        id:
          type: string
          pattern: ^[0-7][0-9A-HJKMNP-TV-Z]{25}$
        status:
          $ref: '#/components/schemas/ApplicationStatus'
        precheck_passed:
          type: boolean
          nullable: true
        admin_note:
          type: string
          nullable: true
          description: Diisi dari kolom review_note.
        housing_type:
          type: string
          nullable: true
        owner_permission:
          type: boolean
          nullable: true
        can_afford:
          type: boolean
          nullable: true
        long_term_plan:
          type: string
          nullable: true
        answers:
          type: object
          additionalProperties: true
          nullable: true
        housing_media_id:
          type: string
          pattern: ^[0-7][0-9A-HJKMNP-TV-Z]{25}$
          nullable: true
        commitment_version:
          type: string
          nullable: true
        commitment_accepted_at:
          type: string
          format: date-time
          nullable: true
        submitted_at:
          type: string
          format: date-time
          nullable: true
        reviewed_at:
          type: string
          format: date-time
          nullable: true
        created_at:
          type: string
          format: date-time
          nullable: true
      required:
      - id
      - status
  responses:
    Error401:
      description: Token login diperlukan atau tidak valid.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Error403:
      description: 'Akses ditolak: NOT_STUDENT, EMAIL_NOT_VERIFIED, FORBIDDEN (bukan pemilik, permission kurang,
        atau kelayakan tidak berlaku).'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Error404:
      description: Resource tidak ditemukan (kode NOT_FOUND; penambahan kode domain ini menunggu persetujuan PM
        utama).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Error409:
      description: Konflik status, kuota, atau permintaan berulang.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Error422:
      description: Input atau prasyarat bisnis tidak valid.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
