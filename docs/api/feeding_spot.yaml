openapi: 3.0.3
info:
  title: Meowtopia Super App - Adopt Feeding Spot (AFS) API
  description: >
    Kontrak OpenAPI resmi untuk modul Adopt Feeding Spot (Tim Acumalaka).
    Mengacu pada PRD Final Meowtopia Super App v1.1 (AFS-01 s.d. AFS-13).
    Verifikasi tidak menggunakan GPS di server (Aturan Keras #8 & OQ-01);
    GPS hanya dipakai di sisi klien (HP) untuk mengurutkan daftar spot terdekat.
  version: 1.1.0
servers:
  - url: /api/v1
    description: REST API v1

paths:
  /feeding/spots:
    get:
      summary: Daftar spot pemberian pakan aktif
      operationId: listFeedingSpots
      tags: [FeedingSpot - Public]
      responses:
        '200':
          description: Daftar spot aktif beserta waktu terakhir diberi makan (last_fed_at) dan agregat 14 hari
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: Daftar spot pemberian pakan berhasil diambil.
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/FeedingSpot'

  /feeding/spots/{id}:
    get:
      summary: Detail spot pemberian pakan beserta last_fed_at dan agregat 14 hari
      operationId: getFeedingSpotDetail
      tags: [FeedingSpot - Public]
      parameters:
        - name: id
          in: path
          required: true
          description: ULID char(26) atau kode unik spot (mis. SPOT-TULT-01)
          schema:
            type: string
      responses:
        '200':
          description: Detail spot aktif
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                  data:
                    $ref: '#/components/schemas/FeedingSpotDetail'
        '404':
          description: Spot tidak ditemukan atau berstatus INACTIVE

  /feeding/heatmap:
    get:
      summary: Data agregat heatmap kebutuhan pakan 14 hari terakhir (AFS-09)
      operationId: getFeedingHeatmap
      tags: [FeedingSpot - Public]
      responses:
        '200':
          description: Daftar koordinat spot aktif beserta skor kebutuhan (need_score) dan last_fed_at

  /feeding/activities:
    post:
      summary: Buka sesi pemberian pakan dengan memindai QR spot resmi (AFS-03) †
      operationId: startFeedingSession
      tags: [FeedingSpot - User]
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [qr_token]
              properties:
                qr_token:
                  type: string
                  example: MTP1.S.TOKEN_SPOT_TULT_01_ACTIVE_123456
      responses:
        '201':
          description: Sesi pemberian pakan berstatus DRAFT berhasil dibuka
        '422':
          description: QR bukan tipe spot (QR_WRONG_TYPE), spot sedang maintenance, atau masih dalam cooldown 6 jam (COOLDOWN_ACTIVE)

  /feeding/activities/{id}/intent:
    post:
      summary: Konfirmasi niat memberi makan dalam batas waktu 15 menit sejak scan (AFS-04) †
      operationId: confirmFeedingIntent
      tags: [FeedingSpot - User]
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200':
          description: Intent berhasil dikonfirmasi
        '403':
          description: Sesi bukan milik pengguna
        '422':
          description: Batas waktu 15 menit terlampaui (SESSION_EXPIRED)

  /feeding/activities/{id}/finalize:
    post:
      summary: Finalisasi sesi pemberian pakan dengan 1-3 bukti foto dan evaluasi FeedingRuleEngine (AFS-05, AFS-06, AFS-10) †
      operationId: finalizeFeedingSession
      tags: [FeedingSpot - User]
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [media_ids]
              properties:
                media_ids:
                  type: array
                  minItems: 1
                  maxItems: 3
                  items:
                    type: string
                food_type:
                  type: string
                  example: dry_food
                food_amount:
                  type: string
                  example: 1 mangkuk
                cat_code:
                  type: string
                  nullable: true
                  example: CAT001
                notes:
                  type: string
                  nullable: true
      responses:
        '200':
          description: Sesi berhasil difinalisasi (VERIFIED atau UNDER_REVIEW)
        '403':
          description: Sesi bukan milik pengguna
        '422':
          description: Sesi kedaluwarsa (>60 menit) atau bukti foto tidak valid

  /feeding/activities/mine:
    get:
      summary: Riwayat kegiatan pemberian makan pengguna beserta status kegiatan dan status reward terpisah (AFS-08)
      operationId: listMyFeedingActivities
      tags: [FeedingSpot - User]
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Daftar riwayat aktivitas pemberian pakan milik pengguna

  /admin/feeding/spots:
    post:
      summary: Buat titik feeding spot baru beserta token QR (AFS-01)
      operationId: createFeedingSpot
      tags: [FeedingSpot - Admin]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateFeedingSpotRequest'
      responses:
        '201':
          description: Spot berhasil dibuat
        '403':
          description: Membutuhkan permission spot.manage

  /admin/feeding/spots/{id}:
    patch:
      summary: Perbarui data atau status feeding spot (ACTIVE, MAINTENANCE, INACTIVE) (AFS-01)
      operationId: updateFeedingSpot
      tags: [FeedingSpot - Admin]
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Spot berhasil diperbarui
        '403':
          description: Membutuhkan permission spot.manage

  /admin/feeding/spots/{id}/qr:
    post:
      summary: Regenerate token QR feeding spot dan cabut token lama (AFS-01)
      operationId: regenerateFeedingSpotQr
      tags: [FeedingSpot - Admin]
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Token QR spot berhasil diperbarui
        '403':
          description: Membutuhkan permission spot.manage

  /admin/feeding/review-queue:
    get:
      summary: Antrean pengajuan pemberian makan berstatus UNDER_REVIEW (AFS-07)
      operationId: getFeedingReviewQueue
      tags: [FeedingSpot - Admin]
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Daftar aktivitas dalam antrean review
        '403':
          description: Membutuhkan permission feeding.review

  /admin/feeding/activities/{id}/review:
    post:
      summary: Simpan keputusan reviewer (VERIFIED atau REJECTED) dengan larangan self-review (AFS-07)
      operationId: reviewFeedingActivity
      tags: [FeedingSpot - Admin]
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [decision]
              properties:
                decision:
                  type: string
                  enum: [VERIFIED, REJECTED]
                notes:
                  type: string
                  nullable: true
      responses:
        '200':
          description: Keputusan review berhasil disimpan
        '403':
          description: Membutuhkan permission feeding.review atau ditolak karena self-review (SELF_REVIEW_FORBIDDEN)

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema:
        type: string
      description: Kunci unik UUID/ULID untuk mencegah duplikasi pada endpoint tulis (†)
  schemas:
    FeedingAggregateSummary:
      type: object
      properties:
        window_days:
          type: integer
          example: 14
        total_feedings:
          type: integer
          example: 6
        unique_feeders:
          type: integer
          example: 4
        need_score:
          type: number
          format: float
          example: 68.5
        last_fed_at:
          type: string
          format: date-time
          nullable: true
    FeedingSpot:
      type: object
      properties:
        id:
          type: string
          example: 01J8ACUMALAKASPOT000000001
        code:
          type: string
          example: SPOT-TULT-01
        name:
          type: string
          example: Spot Pakan TULT Lobby
        description:
          type: string
          nullable: true
        latitude:
          type: number
          format: float
          example: -6.974
        longitude:
          type: number
          format: float
          example: 107.630
        status:
          type: string
          enum: [ACTIVE, MAINTENANCE, INACTIVE]
        last_fed_at:
          type: string
          format: date-time
          nullable: true
          description: Waktu terakhir tercatat diberi makan (AFS-02)
        aggregate:
          $ref: '#/components/schemas/FeedingAggregateSummary'
    FeedingSpotDetail:
      allOf:
        - $ref: '#/components/schemas/FeedingSpot'
        - type: object
          properties:
            recent_activities:
              type: array
              items:
                type: object
    CreateFeedingSpotRequest:
      type: object
      required: [code, name, latitude, longitude]
      properties:
        code:
          type: string
          example: SPOT-TULT-02
        name:
          type: string
          example: Spot Pakan TULT Timur
        description:
          type: string
          nullable: true
        latitude:
          type: number
          format: float
        longitude:
          type: number
          format: float
        territory_id:
          type: string
          nullable: true
        status:
          type: string
          enum: [ACTIVE, MAINTENANCE, INACTIVE]

