openapi: 3.0.3
info:
  title: Meowtopia API - Modul Cat (Rekans Caps)
  version: 1.1.0
  description: |
    Kontrak API untuk master data kucing, QR kalung (`MTP1.C.<token>`), kode cadangan (`unique_code`),
    hub aksi profil, pencatatan perjumpaan (`cat_sightings`), serta operasi kurasi admin.
    Mengacu pada PRD Final Meowtopia SuperApp v1.1 (Bagian 4.2-4.4, 6.2, 8.3).
servers:
  - url: /api/v1
security:
  - bearerAuth: []

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: Sanctum

  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema:
        type: string
        maxLength: 128
      description: Kunci unik per operasi tulis untuk mencegah duplikasi saat retry.

  schemas:
    CatPublic:
      type: object
      description: Profil publik kucing. Tidak pernah memuat koordinat mentah, token QR, atau data privat.
      properties:
        id: { type: string, example: 01JBC9Z8W2V3M4N5P6Q7R8S9T0 }
        unique_code: { type: string, example: CAT001 }
        name: { type: string, example: Oyen }
        gender: { type: string, enum: [MALE, FEMALE, UNKNOWN] }
        color_pattern: { type: string, nullable: true, example: Orange Tabby }
        age_group: { type: string, enum: [KITTEN, ADULT, SENIOR, UNKNOWN] }
        is_sterilized: { type: boolean, nullable: true }
        description: { type: string, nullable: true }
        traits: { type: object, nullable: true, additionalProperties: true }
        territory_id: { type: string, nullable: true }
        primary_photo_media_id: { type: string, nullable: true }
        presence_status: { type: string, enum: [ON_CAMPUS, ADOPTED, MISSING, DECEASED] }
        health_status: { type: string, enum: [HEALTHY, SICK, INJURED, UNDER_CARE] }
        adoption_status: { type: string, enum: [UNREVIEWED, READY, ADOPTED, RETURN_PENDING, RETURNED_REVIEW] }
        verification_status: { type: string, enum: [UNVERIFIED, VERIFIED] }
        first_seen_at: { type: string, format: date-time, nullable: true }
        last_seen_at: { type: string, format: date-time, nullable: true }
        photos:
          type: array
          items:
            type: object
            properties:
              id: { type: string }
              media_id: { type: string }
              angle: { type: string, nullable: true }
              sort_order: { type: integer }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    CatAdmin:
      allOf:
        - $ref: '#/components/schemas/CatPublic'
        - type: object
          properties:
            active_qr:
              type: object
              nullable: true
              properties:
                token_id: { type: string }
                status: { type: string, enum: [ACTIVE] }
                qr_payload: { type: string, example: MTP1.C.aBcDeFgHiJkLmNoPqRsTuVwXyZ012345 }
                issued_at: { type: string, format: date-time }
            deleted_at: { type: string, format: date-time, nullable: true }

    CatAction:
      type: object
      properties:
        id: { type: string, enum: [game.encounter, adoption.apply, incident.report, feeding.start] }
        module: { type: string }
        label: { type: string }
        enabled: { type: boolean }
        reason: { type: string, nullable: true }

    ErrorResponse:
      type: object
      properties:
        success: { type: boolean, example: false }
        code: { type: string, example: FORBIDDEN }
        message: { type: string }
        errors: { type: object, nullable: true }
        request_id: { type: string, format: uuid }

paths:
  /cats:
    get:
      summary: Daftar kucing kampus (publik, berpaginasi)
      tags: [Cat Public]
      parameters:
        - name: presence_status
          in: query
          schema: { type: string, enum: [ON_CAMPUS, ADOPTED, MISSING, DECEASED] }
        - name: adoption_status
          in: query
          schema: { type: string, enum: [UNREVIEWED, READY, ADOPTED, RETURN_PENDING, RETURNED_REVIEW] }
        - name: health_status
          in: query
          schema: { type: string, enum: [HEALTHY, SICK, INJURED, UNDER_CARE] }
        - name: territory_id
          in: query
          schema: { type: string }
        - name: search
          in: query
          schema: { type: string }
        - name: page
          in: query
          schema: { type: integer, default: 1 }
        - name: per_page
          in: query
          schema: { type: integer, default: 15, maximum: 100 }
      responses:
        '200':
          description: Daftar kucing berhasil diambil
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  message: { type: string }
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/CatPublic' }
                  meta: { type: object }

  /cats/{id}:
    get:
      summary: Profil publik kucing berdasarkan ULID
      tags: [Cat Public]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        '200': { description: Detail profil kucing }
        '404': { description: Kucing tidak ditemukan }

  /cats/by-code/{unique_code}:
    get:
      summary: Cari profil publik kucing berdasarkan kode cetak kalung (manual input)
      tags: [Cat Public]
      parameters:
        - name: unique_code
          in: path
          required: true
          schema: { type: string, example: CAT001 }
      responses:
        '200': { description: Kucing ditemukan }
        '404': { description: Kode tidak ditemukan }

  /cats/{id}/actions:
    get:
      summary: Daftar aksi hub pada halaman profil kucing
      tags: [Cat Public]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Daftar aksi tersedia
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  message: { type: string }
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/CatAction' }

  /cats/{id}/sightings:
    post:
      summary: Catat perjumpaan kucing (idempoten, deduplikasi 30 menit per user+cat+source, tanpa poin)
      tags: [Cat Public]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                source:
                  type: string
                  enum: [manual_sighting, encounter, feeding, adoption_pickup, adoption_return]
                  default: manual_sighting
                location_lat: { type: number, nullable: true }
                location_lng: { type: number, nullable: true }
                accuracy_m: { type: number, nullable: true }
                metadata: { type: object, nullable: true }
      responses:
        '201': { description: Perjumpaan baru tercatat }
        '200': { description: Deduplikasi dalam 30 menit terakhir atau respons cache idempotensi }
        '400': { description: Header Idempotency-Key tidak ada }
        '409': { description: Idempotency-Key dipakai dengan payload berbeda }

  /admin/cats:
    post:
      summary: Buat profil kucing baru + token QR aktif awal (izin cat.edit)
      tags: [Cat Admin]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                unique_code: { type: string, nullable: true }
                name: { type: string }
                gender: { type: string, enum: [MALE, FEMALE, UNKNOWN] }
                color_pattern: { type: string, nullable: true }
                age_group: { type: string, enum: [KITTEN, ADULT, SENIOR, UNKNOWN] }
                is_sterilized: { type: boolean, nullable: true }
                description: { type: string, nullable: true }
                traits: { type: object, nullable: true }
                territory_id: { type: string, nullable: true }
                primary_photo_media_id: { type: string, nullable: true }
                verification_status: { type: string, enum: [UNVERIFIED, VERIFIED] }
      responses:
        '201': { description: Profil kucing berhasil dibuat (default ON_CAMPUS, HEALTHY, UNREVIEWED) }
        '403': { description: Tidak memiliki izin cat.edit }
        '422': { description: Validasi gagal }

  /admin/cats/{id}:
    patch:
      summary: Perbarui profil kucing (izin cat.edit; ubah presence_status butuh cat.curate + status_reason)
      tags: [Cat Admin]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string }
                gender: { type: string, enum: [MALE, FEMALE, UNKNOWN] }
                color_pattern: { type: string, nullable: true }
                age_group: { type: string, enum: [KITTEN, ADULT, SENIOR, UNKNOWN] }
                is_sterilized: { type: boolean, nullable: true }
                description: { type: string, nullable: true }
                territory_id: { type: string, nullable: true }
                verification_status: { type: string, enum: [UNVERIFIED, VERIFIED] }
                presence_status: { type: string, enum: [ON_CAMPUS, MISSING, DECEASED] }
                status_reason: { type: string }
      responses:
        '200': { description: Profil diperbarui }
        '403': { description: Akses ditolak }
        '404': { description: Kucing tidak ditemukan }
        '409': { description: Transisi presence_status tidak diizinkan }
        '422': { description: Validasi gagal }

  /admin/cats/import:
    post:
      summary: Impor data kucing awal dari CSV (izin cat.edit atau cat.curate)
      tags: [Cat Admin]
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file: { type: string, format: binary }
      responses:
        '200': { description: Ringkasan hasil impor (imported, skipped, errors) }
        '403': { description: Akses ditolak }

  /admin/cats/{id}/qr/regenerate:
    post:
      summary: Cabut token QR lama dan terbitkan token baru untuk kucing yang sama (izin cat.qr.regenerate)
      tags: [Cat Admin]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              properties:
                reason: { type: string, example: Kalung hilang di area GKU }
      responses:
        '200': { description: Token baru diterbitkan, token lama dicabut, event CatQrRegenerated dikirim }
        '403': { description: Tidak memiliki izin cat.qr.regenerate }
        '404': { description: Kucing tidak ditemukan }

  /admin/cats/qr-sheet:
    get:
      summary: Data lembar cetak QR kalung kucing aktif (izin cat.qr.regenerate atau cat.curate)
      tags: [Cat Admin]
      parameters:
        - name: territory_id
          in: query
          schema: { type: string }
        - name: cat_ids
          in: query
          schema: { type: string, description: Daftar ULID kucing dipisah koma }
      responses:
        '200': { description: Daftar QR siap cetak }
        '403': { description: Akses ditolak }

  /admin/cats/{id}/traits:
    put:
      summary: Simpan/perbarui jawaban atribut fisik terverifikasi kucing untuk Akinator (izin cat.curate / cat.edit)
      tags: [Cat Admin]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [traits]
              properties:
                traits:
                  type: array
                  items:
                    type: object
                    required: [question_id, answer]
                    properties:
                      question_id: { type: string }
                      answer: { type: string, enum: [YES, NO] }
      responses:
        '200': { description: Atribut berhasil disimpan }
        '403': { description: Akses ditolak }
        '404': { description: Kucing tidak ditemukan }

  /admin/cats/{id}/merge:
    post:
      summary: Gabungkan profil kucing duplikat ke profil utama (izin cat.curate)
      tags: [Cat Admin]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, description: ULID profil kucing utama }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [duplicate_cat_id, reason]
              properties:
                duplicate_cat_id: { type: string }
                reason: { type: string }
      responses:
        '200': { description: Profil duplikat digabungkan, riwayat dipindahkan, token lama dicabut, audit dicatat }
        '403': { description: Tidak memiliki izin cat.curate }
        '404': { description: Kucing tidak ditemukan }
        '409': { description: Tidak dapat menggabungkan kucing dengan dirinya sendiri }
