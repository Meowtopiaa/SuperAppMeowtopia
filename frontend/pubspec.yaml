name: meowtopia
description: "Meowtopia - Campus Cat Ecosystem Super App"
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # State Management
  provider: ^6.1.2

  # Networking
  dio: ^5.7.0

  # Routing
  go_router: ^14.6.2

  # Secure Storage
  flutter_secure_storage: ^9.2.2

  # Typography & Formatting
  google_fonts: ^6.2.1
  intl: ^0.19.0

  # Icons
  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/icons/
