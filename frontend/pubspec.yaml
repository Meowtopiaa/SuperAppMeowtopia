name: meowtopia
description: "Meowtopia - Campus Cat Ecosystem Super App"
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.13.0 <4.0.0"
  flutter: ">=3.44.0"

dependencies:
  flutter:
    sdk: flutter

  # State Management
  provider: ^6.1.2

  # Networking
  dio: ^5.7.0

  # Routing
  go_router: ^14.6.2

  # Secure Storage
  flutter_secure_storage: ^9.2.2

  # Icons and camera
  # Adaptive Flutter controls also need the Cupertino icon font.
  cupertino_icons: ^1.0.8
  flutter_svg: ^2.2.3
  camera: ^0.12.2
  mobile_scanner: ^7.4.3

dev_dependencies:
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/icons/
    - assets/images/figma/
    - assets/icons/figma/

  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter.ttf
