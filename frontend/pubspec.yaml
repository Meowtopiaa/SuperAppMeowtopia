name: meowtopia
description: "Meowtopia - Campus Cat Ecosystem Super App"
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # State Management
  provider: ^6.1.2

  # Networking
  dio: ^5.7.0

  # Routing
  go_router: ^14.6.2

  # Storage
  flutter_secure_storage: ^9.2.2
  shared_preferences: ^2.3.2

  # QR Scanner, Camera & Media
  mobile_scanner: ^5.2.3
  camera: ^0.11.0+1
  image_picker: ^1.1.2

  # Location & Maps
  geolocator: ^13.0.1
  flutter_map: ^7.0.2
  latlong2: ^0.9.1

  # UI, SVG & Utilities
  flutter_svg: ^2.0.10+1
  cached_network_image: ^3.4.1
  uuid: ^4.5.1
  google_fonts: ^6.2.1
  intl: ^0.19.0
  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/images/figma/
    - assets/icons/
    - assets/icons/figma/

  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter.ttf
